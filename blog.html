        <!-- Blog Display Script -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                displayAllBlogPosts();
            });

            function displayAllBlogPosts() {
                const container = document.getElementById('blog-posts-container');
                const blogs = blogManager.getAllBlogs();
                
                if (blogs.length === 0) {
                    container.innerHTML = '<div class="text-center"><p>No blog posts available yet.</p></div>';
                    return;
                }

                let html = '';
                blogs.forEach(blog => {
                    html += `
                        <div class="blog-post margin-b-30">
                            ${blog.imageUrl ? `
                                <div class="blog-post-img">
                                    <img class="img-responsive" src="${blog.imageUrl}" alt="${blog.title}">
                                </div>
                            ` : ''}
                            <div class="blog-post-content">
                                <h3 class="blog-post-title">${blog.title}</h3>
                                <p class="blog-post-text">${blog.content}</p>
                                <div class="blog-post-meta">
                                    <span class="blog-post-date">${blog.date}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            }
        </script>
